<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a2a5c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Özkuruşlar Depo Yönetim Sistemi</title>
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--n:#0a2a5c;--b:#1565c0;--l:#e6eefb;--bg:#eef2fa;--t:#10243f;--m:#5b6b82;--bd:#c5d3ea}
*{box-sizing:border-box}
body{margin:0;font:15px/1.4 Roboto,system-ui,Arial,sans-serif;background:var(--bg);color:var(--t);padding-bottom:env(safe-area-inset-bottom)}
header{background:linear-gradient(90deg,#082350,#0d3a78);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top))}
header img{height:40px;border-radius:4px}
header .t{flex:1;font-size:10px;letter-spacing:.06em;line-height:1.3}
header .r{text-align:right;font-size:10px;line-height:1.3}
header .r b{display:block;font-size:13px}
nav{background:#0a2a5c;display:flex;overflow-x:auto;gap:6px;padding:8px;position:sticky;top:0;z-index:5}
main{padding:12px;max-width:820px;margin:auto}
.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 2px 10px #0a2a5c18;margin-bottom:14px}
h1{font-size:22px;color:var(--n);margin:0 0 4px}
.sub{color:var(--m);margin:0 0 14px}
h2.sec{background:var(--n);color:#fff;font-size:14px;margin:18px -18px 12px;padding:11px 18px}
button{font:inherit;font-weight:700;font-size:14px;border-radius:10px;padding:12px 14px;border:1px solid var(--bd);background:var(--l);color:var(--n);cursor:pointer}
button.p{background:var(--b);color:#fff;border-color:var(--b)}
nav button{flex:none;border:0;background:none;color:#fff;white-space:nowrap}
nav button.on{background:var(--b)}
button.del{background:#fde8e8;color:#b3261e;border-color:#f3c1c1;padding:6px 12px}
.g2,.rg,.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.full{grid-column:1/-1}
.f{display:block}
.f span{display:block;font-size:12px;font-weight:700;color:var(--m);margin-bottom:4px}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;background:#fff;color:var(--t)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--b);border-color:var(--b)}
input[readonly]{background:#f1f4fa}
.tile{border-radius:16px;padding:16px;background:var(--l);border:1px solid var(--bd)}
.tile.dark{background:#0f4488;color:#fff;border-color:#0f4488}
.tile i{display:block;font-size:44px;font-style:normal;font-weight:300;line-height:1.2}
.tile small{display:block}
.tiles{margin-bottom:14px}
.stat{border-radius:14px;padding:12px;background:var(--l);border:1px solid var(--bd)}
.stat.dark{background:var(--n);color:#fff;border-color:var(--n)}
.stat b{font-size:13px;display:block}
.stat input{background:none;border:0;border-bottom:1px solid #8aa0c0;border-radius:0;padding:4px 0;color:inherit}
.stat .big{font-size:30px;font-weight:700}
.stat .sm{font-size:13px}
.stat.dark .sm{opacity:.8}
.rw{border:1px solid var(--bd);border-radius:12px;padding:10px;margin-bottom:10px;background:#f8faff}
.rh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:700;color:var(--n)}
.rg{gap:8px}
.add{width:100%}
.bar{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}
.bar .p{grid-column:1/-1}
.st{display:flex;gap:8px;margin-bottom:12px}
.st button{flex:1;font-size:13px}
.note{background:var(--l);border:1px solid var(--bd);border-radius:12px;padding:12px;font-size:13px;margin-top:14px}
.it{border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.it .ac{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.it button{padding:8px 12px;font-size:13px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;opacity:0;transition:.3s;pointer-events:none;z-index:9;font-size:14px;max-width:90%;text-align:center}
#toast.on{opacity:1}
#print{display:none}
.doc{font:12px Arial,sans-serif;color:#000;padding:8px}
.doc h2{font-size:16px;margin:8px 0}
.doc h3{font-size:13px;margin:14px 0 4px}
.doc table{border-collapse:collapse;width:100%}
.doc td,.doc th{border:1px solid #777;padding:4px 6px;text-align:left;vertical-align:top}
.doc th{background:#dde6f5}
.doc .meta td{border:0;padding:2px 8px 2px 0;width:auto}
@media print{body.pr>:not(#print){display:none!important}body.pr #print{display:block}@page{margin:12mm}}
</style>
</head>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const fd=s=>s?s.split('-').reverse().join('.'):'';
const lines=x=>String(x||'').split('\n').map(l=>l.trim()).filter(Boolean);
const days=r=>r.b&&r.s?Math.max(0,Math.round((new Date(r.s)-new Date(r.b))/864e5)+1):'';
const LS={get(k,f){try{const v=JSON.parse(localStorage.getItem(k));return v==null?f:v}catch(e){return f}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){toast('Kayıt yapılamadı: tarayıcı depolaması dolu veya kapalı')}}};

const TT={sev:'Sevkiyat Operasyon Raporu',mesai:'Fazla Mesai Takip Raporu',izin:'Personel İzin Takip Raporu'};
const IZIN=['Yıllık izin','Mazeret izni','Raporlu / hastalık','Ücretsiz izin','Serbest izin','Diğer'];
const blank={
 sev:()=>({date:today(),reporter:'Sevkiyat ve Operasyon Sorumlusu',chief:'ENGİN KELLE',tS:23,tK:23,
  st:{sofor:'',izinli:'',izinliN:'',kamyon:'',kamyonN:'',pasif:'',pasifN:''},
  rows:[{p:'Tamamlanan Sevkiyat Bölgesi'},{p:'Operasyon Tamamlanma Saati'},{p:'Erken Çıkış Yapan Sevkiyatlar'}],
  per:[{k:'Aktif Sevkiyattaki Şoförler'},{k:'Araç Bakım / Muayene Şoförü'},{k:'İzinli Şoförler'}],names:'',
  fleet:[{k:'Aktif Sevkiyattaki Araçlar'},{k:'Serviste / Muayenede Araçlar'},{k:'Filoda Kullanılmayan Araçlar'}],plates:'',
  dT:"Sevkiyatın 13:00'a Sarkmasına Neden Olumsuzluklar:",delay:''}),
 mesai:()=>({date:today(),prep:'',rows:Array.from({length:6},()=>({})),note:''}),
 izin:()=>({date:today(),prep:'',rows:Array.from({length:5},()=>({})),note:''})
};
let page='home',sub='mesai',drafts={};
const fix=(t,o)=>{const x=Object.assign(blank[t](),o);if(t==='sev')x.st=Object.assign(blank.sev().st,o&&o.st);return x};
const getD=t=>drafts[t]||(drafts[t]=fix(t,LS.get('ozk_d_'+t,null)));
const saveD=t=>LS.set('ozk_d_'+t,drafts[t]);
let tt;
function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2600)}
function setPath(o,p,v){const k=p.split('.');let c=o;for(let i=0;i<k.length-1;i++)c=c[k[i]];c[k[k.length-1]]=v}

/* form helpers */
const inp=(t,f,v,l,o={})=>`<label class="f ${o.w||''}"><span>${l}</span><input data-t="${t}" data-f="${f}" type="${o.type||'text'}" value="${esc(v)}" placeholder="${o.ph||''}"${o.ro?' readonly':''}${o.id?` id="${o.id}"`:''}></label>`;
const sel=(t,f,v,l,o)=>`<label class="f"><span>${l}</span><select data-t="${t}" data-f="${f}">${['',...o].map(x=>`<option${x===v?' selected':''}>${x}</option>`).join('')}</select></label>`;
const area=(t,f,v,l,ph)=>`<label class="f"><span>${l}</span><textarea rows="5" data-t="${t}" data-f="${f}" placeholder="${ph}">${esc(v)}</textarea></label>`;
const row=(t,i,f,l)=>`<div class="rw"><div class="rh"><span>${i+1}</span><button class="del" data-del="${t}:${l?l+':':''}${i}">Sil</button></div><div class="rg">${f}</div></div>`;
const bar=t=>autoBox()+`<div class="bar"><button class="p" data-act="save:${t}">Kaydet</button><button data-act="pdf:${t}">PDF / Yazdır</button><button data-act="word:${t}">Word indir</button><button data-act="xls:${t}">Excel (.xlsx)</button><button data-act="draft:${t}">Taslağı kaydet</button><button data-act="new:${t}">Yeni rapor</button></div>`;

/* views */
function vHome(){const r=LS.get('ozk_r',[]),a=r.filter(x=>x.type==='sev').length,b=r.length-a,p=n=>String(n).padStart(2,'0');
return `<section class="card"><h1>Depo Yönetim Sistemi</h1><p class="sub">Günlük operasyon ve personel raporlaması</p>
<div class="tiles"><div class="tile dark"><b>Sevkiyat Raporları</b><i>${p(a)}</i><small>Günlük operasyon takibi</small></div><div class="tile"><b>İzin ve Mesai</b><i>${p(b)}</i><small>Personel takibi</small></div></div>
<div class="g2"><button class="p" data-go="sev">Sevkiyat raporu oluştur</button><button data-go="izin">Mesai / izin raporu oluştur</button></div>
<div class="note">Bu ilk sürümde kayıtlar bu tarayıcıda saklanır. Farklı cihazlarda ortak kullanım için çevrimiçi veritabanı ve kullanıcı girişi ayrıca kurulmalıdır.</div></section>`}

function vSev(){const d=getD('sev'),s=d.st;
const card=(c,l,k,nk,txt)=>`<div class="stat ${c}"><b>${l}</b><input class="big" type="number" inputmode="numeric" data-t="sev" data-f="st.${k}" value="${esc(s[k])}">${nk?`<input class="sm" data-t="sev" data-f="st.${nk}" value="${esc(s[nk])}" placeholder="Açıklama">`:`<small class="sm">${txt}</small>`}</div>`;
const list=(l,fs)=>(d[l]||[]).map((r,i)=>row('sev',i,fs(r,i),l)).join('')+`<button class="add" data-add="sev:${l}">+ Satır ekle</button>`;
const four=(l,c3,c4)=>(r,i)=>inp('sev',`${l}.${i}.k`,r.k,'Kategori',{w:'full'})+inp('sev',`${l}.${i}.s`,r.s,'Sayı',{type:'number'})+inp('sev',`${l}.${i}.n`,r.n,c3)+inp('sev',`${l}.${i}.a`,r.a,c4,{w:'full'});
return `<section class="card"><h1>ÖZKURUŞLAR MERKEZ DEPO</h1><h1 style="font-size:18px">SEVKİYAT OPERASYON RAPORU</h1><p class="sub">Lojistik ve Operasyon Direktörlüğü</p>
<div class="g2">${inp('sev','date',d.date,'Rapor tarihi',{type:'date',w:'full'})}${inp('sev','reporter',d.reporter,'Raporlayan',{w:'full'})}${inp('sev','chief',d.chief,'Sevkiyat sorumlusu',{w:'full'})}${inp('sev','tS',d.tS,'Toplam şoför',{type:'number'})}${inp('sev','tK',d.tK,'Toplam kamyon',{type:'number'})}</div>
<div class="g2" style="margin-top:14px">${card('dark','Aktif sevkiyat şoförü','sofor','',`Toplam ${esc(d.tS)} şoför içinde`)}${card('','Bakım / izinli şoför','izinli','izinliN')}${card('dark','Sevkiyattaki kamyon','kamyon','kamyonN')}${card('','Pasif / servisteki kamyon','pasif','pasifN')}</div>
<h2 class="sec">1. Operasyon ve sevkiyat özeti</h2>
${list('rows',(r,i)=>inp('sev',`rows.${i}.p`,r.p,'Parametre',{w:'full'})+inp('sev',`rows.${i}.v`,r.v,'Durum / değer',{ph:'Örn. 35 + 1 şube'})+inp('sev',`rows.${i}.a`,r.a,'Açıklama'))}
<h2 class="sec">2. Personel / şoför durum detayı</h2>
${list('per',four('per','Personel isimleri','Operasyonel statü / açıklama'))}
${area('sev','names',d.names,'Aktif sevkiyatta yer alan şoför listesi (her satıra bir isim)','Abdulbaki Almaz\nAdnan Aker')}
<h2 class="sec">3. Kamyon filosu durum detayı</h2>
${list('fleet',four('fleet','Plakalar','Operasyonel durum'))}
${area('sev','plates',d.plates,'Sevkiyatta kullanılan kamyon plakaları (her satıra bir plaka)','34 EFH 122\n34 HAR 489')}
<h2 class="sec">4. Operasyonel aksama ve gecikme analizi</h2>
<div class="g2">${inp('sev','dT',d.dT,'Alt başlık',{w:'full'})}</div><div style="height:10px"></div>
${area('sev','delay',d.delay,'Gecikme gerekçeleri (her satıra bir madde)','Rampa kullanım engelleri...\nFilo kapasite darboğazı...')}

function docHtml(t,d,img){const s=spec(t,d);
 const tb=x=>`<h3>${esc(x.h)}</h3><table><tr>${x.c.map(c=>`<th>${esc(c)}</th>`).join('')}</tr>${x.r.map(r=>`<tr>${r.map(c=>`<td>${esc(c)}</td>`).join('')}</tr>`).join('')}</table>`;
 return `<div class="doc">${img?`<img src="${LOGO}" height="40">`:''}<h2>${esc(s.title)}</h2><table class="meta">${s.meta.map(m=>`<tr><td><b>${esc(m[0])}</b></td><td>${esc(m[1])}</td></tr>`).join('')}</table>${s.tabs.map(tb).join('')}${s.txt.map(x=>`<h3>${esc(x[0])}</h3><p>${esc(x[1]).replace(/\n/g,'<br>')}</p>`).join('')}</div>`}
function dl(n,b){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}

function pdf(t,d){$('#print').innerHTML=docHtml(t,d,1);document.body.classList.add('pr');toast('Açılan pencerede "PDF olarak kaydet" seçin');setTimeout(()=>window.print(),400)}

 let r=1;const H=h=>{ws.getRow(r).height=h};
 put(r,1,4,'ÖZKURUŞLAR MERKEZ DEPO',{sz:17,b:1});H(23);r++;
 put(r,1,3,'SEVKİYAT OPERASYON RAPORU',{sz:16,b:1});put(r,4,4,'Rapor Tarihi',{sz:8,fc:G,h:'right'});H(23);r++;
 put(r,1,2,'LOJİSTİK VE OPERASYON DİREKTÖRLÜĞÜ.',{fc:G,b:1});put(r,3,3,'SEVKİYAT SORUMLUSU: '+d.chief,{fc:G,b:1});put(r,4,4,fd(d.date),{sz:10,b:1,h:'right',nb:1});H(30);r+=2;
 const cards=[['AKTİF SEVKİYAT ŞOFÖRÜ',s.sofor,'Toplam '+d.tS+' Şoför İçinde'],['BAKIM / İZİNLİ ŞOFÖR',s.izinli,s.izinliN],['SEVKİYATTAKİ KAMYON',s.kamyon,s.kamyonN],['PASİF / SERVİSTEKİ KAMYON',s.pasif,s.pasifN]];

  rows.forEach((x,j)=>{x.forEach((v,i)=>put(r,i+1,i+1,i===1?nv(v):v,{b:i===0,bg:i===3?tn[j%tn.length]:null,h:i===1?'center':'left'}));H(Math.max(est(x[0],28,30),est(x[1],11),est(x[2],28),est(x[3],35)));r++});r++};
 sec('1. OPERASYON VE SEVKİYAT ÖZETİ');
 put(r,1,1,'Parametre',{b:1,bg:LB});put(r,2,2,'Durum / Değer',{b:1,bg:LB});put(r,3,4,'Açıklama',{b:1,bg:LB});H(22);r++;

 put(r,1,4,'AKTİF SEVKİYATTA YER ALAN ŞOFÖR LİSTESİ ('+nm.length+' PERSONEL):',{fc:G,b:1});H(22);r++;

 else{dl(n+'.csv',new Blob(['\ufeff'+a.map(r=>r.map(c=>'"'+String(c==null?'':c).replace(/"/g,'""')+'"').join(';')).join('\r\n')],{type:'text/csv'}));toast('İnternet yok: Excel yerine CSV indirildi')}}
function save(t){const d=getD(t),r=LS.get('ozk_r',[]);d.id=d.id||Date.now();
 const rec={id:d.id,type:t,date:d.date,at:new Date().toLocaleString('tr-TR'),data:JSON.parse(JSON.stringify(d))},i=r.findIndex(x=>x.id===d.id);
 if(i>=0)r[i]=rec;else r.unshift(rec);LS.set('ozk_r',r);saveD(t);const o=LS.get('ozk_auto',{xls:1,pdf:1});toast('Rapor kaydedildi'+(o.xls||o.pdf?', dosyalar hazırlanıyor':''));if(o.xls)xls(t,d);if(o.pdf)setTimeout(()=>pdf(t,d),1500)}

/* events */
function onInput(e){const el=e.target,f=el.dataset.f;if(el.dataset.ax){const o=LS.get('ozk_auto',{xls:1,pdf:1});o[el.dataset.ax]=el.checked?1:0;LS.set('ozk_auto',o);return}if(!f)return;const t=el.dataset.t,d=getD(t);setPath(d,f,el.value);saveD(t);
 if(t==='mesai'&&$('#tot'))$('#tot').value=d.rows.filter(r=>r.n).length;
 const m=f.match(/^rows\.(\d+)\.[bs]$/);if(t==='izin'&&m)$('#g'+m[1]).value=days(d.rows[m[1]])}
document.addEventListener('input',onInput);
document.addEventListener('change',onInput);
document.addEventListener('click',e=>{const b=e.target.closest('[data-go],[data-sub],[data-act],[data-add],[data-del],[data-pa]');if(!b)return;const D=b.dataset;
 if(D.go){page=D.go;render();scrollTo(0,0)}
 else if(D.sub){sub=D.sub;render()}
 else if(D.add){const[t,k]=D.add.split(':');getD(t)[k||'rows'].push({});saveD(t);render()}
 else if(D.del){const p=D.del.split(':'),i=p.pop(),t=p[0];getD(t)[p[1]||'rows'].splice(+i,1);saveD(t);render()}
 else if(D.act){const[a,t]=D.act.split(':');A[a](t)}
 else if(D.pa){const[a,id]=D.pa.split(':'),r=LS.get('ozk_r',[]),x=r.find(z=>String(z.id)===id);if(!x)return;
  if(a==='open'){drafts[x.type]=fix(x.type,JSON.parse(JSON.stringify(x.data)));saveD(x.type);page=x.type==='sev'?'sev':'izin';if(x.type!=='sev')sub=x.type;render();scrollTo(0,0)}
  else if(a==='del'){if(confirm('Rapor silinsin mi?')){LS.set('ozk_r',r.filter(z=>String(z.id)!==id));render()}}
  else EXP[a](x.type,fix(x.type,x.data))}});
